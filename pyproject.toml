[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cloakix"
version = "0.1.1"
description = "Detect and mask personal identifiers (PII/PHI) in Arabic and English text."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
authors = [{ name = "Cloakix Authors" }]
keywords = [
  "pii", "phi", "anonymization", "de-identification", "masking", "redaction",
  "privacy", "arabic", "nlp", "healthcare", "gcc", "egypt",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Natural Language :: Arabic",
  "Natural Language :: English",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
# The core engine (rules, validators, operators) has no third-party dependencies.
dependencies = []

[project.optional-dependencies]
ner = ["transformers>=4.44", "torch>=2.6"]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["cloakix[ner,api]"]
dev = [
  "cloakix[api]",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
cloakix = "cloakix.cli:main"

[project.urls]
Homepage = "https://github.com/good2idnan/cloakix"
Repository = "https://github.com/good2idnan/cloakix"
Issues = "https://github.com/good2idnan/cloakix/issues"
Changelog = "https://github.com/good2idnan/cloakix/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cloakix"]

[tool.hatch.build.targets.sdist]
include = ["src/cloakix", "tests", "licenses", "README.md", "LICENSE", "NOTICE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not ner'"
markers = [
  "ner: downloads and runs the NER models (run with: pytest -m ner)",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Arabic text in strings and comments is intentional.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-local-folder = ["conftest"]

[tool.ruff.format]
# Code snippets in the docs are aligned by hand for readability.
exclude = ["*.md"]

[tool.mypy]
python_version = "3.10"
files = ["src/cloakix"]
disallow_untyped_defs = true
warn_unused_ignores = true
ignore_missing_imports = true
